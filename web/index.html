<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>VDec BI</title>
  <!-- PWA: installable app (manifest + service worker registered in app.js) -->
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#fcfcfb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1a1a19" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="VDec BI">
  <link rel="apple-touch-icon" sizes="180x180" href="/static/icons/apple-touch-icon.png?v=__ASSET_V__">
  <!-- Browser-tab / desktop / PWA icons: all from web/icons/ (replace the PNGs there to rebrand; ?v= is filled in by the server so browsers pick up new icons) -->
  <link rel="icon" type="image/png" sizes="32x32" href="/static/icons/favicon-32.png?v=__ASSET_V__">
  <link rel="icon" type="image/png" sizes="192x192" href="/static/icons/icon-192.png?v=__ASSET_V__">
  <link rel="stylesheet" href="/static/app.css?v=__ASSET_V__">
  <script src="/static/vendor/echarts.min.js" defer></script>
  <script src="/static/chart_options.js?v=__ASSET_V__" defer></script>
  <script src="/static/report.js?v=__ASSET_V__" defer></script>
  <script src="/static/schedule.js?v=__ASSET_V__" defer></script>
  <script src="/static/share.js?v=__ASSET_V__" defer></script>
  <script src="/static/settings.js?v=__ASSET_V__" defer></script>
  <script src="/static/credits.js?v=__ASSET_V__" defer></script>
  <script src="/static/app.js?v=__ASSET_V__" defer></script>
</head>
<body>
  <!-- Login -->
  <main id="login-view" class="login-view" hidden>
    <form id="login-form" class="login-card" autocomplete="on">
      <div class="login-top">
        <div class="brand brand-lg"><img class="brand-logo brand-logo-light" src="/static/icons/vdec-logo-light.png?v=__ASSET_V__" alt="VDec BI"><img class="brand-logo brand-logo-dark" src="/static/icons/vdec-logo-dark.png?v=__ASSET_V__" alt="" aria-hidden="true"></div>
        <select id="login-lang" class="lang-select" aria-label="Language"></select>
      </div>
      <h1 data-i18n="sign_in_title">Sign in to your dashboard</h1>
      <label><span data-i18n="username">Username</span><input id="login-user" name="username" autocomplete="username" required></label>
      <label><span data-i18n="password">Password</span><input id="login-pass" name="password" type="password" autocomplete="current-password" required></label>
      <p id="login-error" class="form-error" role="alert"></p>
      <button type="submit" class="btn btn-primary" data-i18n="sign_in">Sign in</button>
      <p class="login-foot" data-i18n="login_foot">Each account only sees the businesses it is granted.</p>
    </form>
  </main>

  <!-- App -->
  <div id="app-view" class="app" hidden>
    <!-- Phone app bar (hidden on wide screens): menu, current section, filters -->
    <header class="appbar" id="appbar">
      <button id="menu-btn" class="icon-btn" data-i18n-title="menu" title="Menu" aria-label="Menu" aria-controls="sidebar" aria-expanded="false"></button>
      <div class="appbar-title"><span id="appbar-tenant" class="eyebrow"></span><span id="appbar-section"></span></div>
      <button id="user-btn-m" class="icon-btn avatar-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="user-pop" data-i18n-title="user_menu" title="Account and language"><span class="avatar" aria-hidden="true"></span><i class="cr-dot" hidden></i></button>
      <button id="bell-btn-m" class="icon-btn bell-btn" data-i18n-title="bell_title" title="Early warnings" aria-label="Early warnings" hidden></button>
      <button id="filter-btn" class="btn btn-filter appbar-filter" aria-controls="filters" aria-expanded="false">
        <span id="filter-btn-icon" aria-hidden="true"></span><span id="filter-btn-text"></span>
      </button>
    </header>
    <nav id="tabstrip" class="tabstrip" aria-label="Sections"></nav>
    <div id="scrim" class="scrim" hidden></div>
    <aside class="sidebar" id="sidebar">
      <div class="drawer-head">
        <div class="brand"><img class="brand-logo brand-logo-light" src="/static/icons/vdec-logo-light.png?v=__ASSET_V__" alt="VDec BI"><img class="brand-logo brand-logo-dark" src="/static/icons/vdec-logo-dark.png?v=__ASSET_V__" alt="" aria-hidden="true"></div>
        <button id="drawer-close" class="icon-btn drawer-close" data-i18n-title="close" title="Close" aria-label="Close"></button>
      </div>
      <label class="tenant-picker">
        <span class="eyebrow" data-i18n="business">Business</span>
        <select id="tenant-select" aria-label="Business"></select>
      </label>
      <nav id="section-nav" class="section-nav" aria-label="Sections"></nav>
      <div class="sidebar-foot">
        <div id="freshness" class="freshness"></div>
        <button id="install-btn" class="btn install-btn" hidden><span id="install-icon" aria-hidden="true"></span><span data-i18n="install_app">Install app</span></button>
        <p id="ios-install-hint" class="ios-hint" hidden data-i18n="ios_install_hint">To install: tap Share, then Add to Home Screen.</p>
        <nav class="foot-nav" aria-label="Settings">
          <button class="nav-item" id="settings-nav" data-sec="settings"><span id="settings-nav-icon" class="nav-ico" aria-hidden="true"></span><span data-i18n="nav_settings">Settings</span></button>
        </nav>
        <div class="user-row">
          <div><div id="user-name" class="user-name"></div><div id="user-role" class="user-role"></div></div>
          <button id="logout-btn" class="icon-btn" data-i18n-title="sign_out" title="Sign out" aria-label="Sign out"></button>
        </div>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="title-block">
          <div id="tenant-line" class="eyebrow"></div>
          <h1 id="section-title"></h1>
          <p id="section-desc" class="muted"></p>
        </div>
        <div class="topbar-right">
        <div class="userbar" id="userbar">
          <label class="lang-pick"><span id="lang-ico" aria-hidden="true"></span><select id="top-lang" data-i18n-title="language" title="Language" aria-label="Language"></select></label>
          <button id="user-btn" class="user-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="user-pop" data-i18n-title="user_menu" title="Account and language">
            <span class="avatar" id="user-avatar" aria-hidden="true"></span>
            <span class="user-btn-text"><b id="user-btn-name"></b><small id="user-btn-role"></small></span><i class="cr-dot" id="user-btn-dot" hidden></i>
          </button>
        </div>
        <div class="filters" id="filters" role="group" aria-label="Filters">
          <div class="sheet-head"><span class="sheet-grip" aria-hidden="true"></span>
            <b data-i18n="filters">Filters</b>
            <button id="sheet-done" class="btn btn-primary btn-sm" data-i18n="done">Done</button></div>
          <div class="filter period-filter">
            <button id="period-btn" class="btn btn-filter" aria-haspopup="true" aria-expanded="false">
              <span class="filter-label" data-i18n="period">Period</span><span id="period-text"></span>
            </button>
            <div id="period-pop" class="popover" hidden>
              <ul id="preset-list" class="preset-list" role="listbox"></ul>
              <div class="custom-range">
                <span class="eyebrow" data-i18n="custom_range">Custom range</span>
                <div class="custom-row">
                  <input type="date" id="custom-start" aria-label="Start date">
                  <span class="muted" data-i18n="to">to</span>
                  <input type="date" id="custom-end" aria-label="End date">
                </div>
                <button id="custom-apply" class="btn btn-primary btn-sm" data-i18n="apply">Apply</button>
              </div>
            </div>
          </div>
          <label class="filter"><span class="filter-label" data-i18n="compare">Compare</span>
            <select id="compare-select">
              <option value="previous" data-i18n="cmp_previous">Previous period</option>
              <option value="yoy" data-i18n="cmp_yoy">Same period last year</option>
              <option value="none" data-i18n="cmp_none">No comparison</option>
            </select>
          </label>
          <div class="filter segmented" role="radiogroup" aria-label="Time grain" id="grain-group">
            <button data-grain="auto" role="radio" data-i18n="grain_auto">Auto</button>
            <button data-grain="day" role="radio" data-i18n="grain_day">Day</button>
            <button data-grain="week" role="radio" data-i18n="grain_week">Week</button>
            <button data-grain="month" role="radio" data-i18n="grain_month">Month</button>
            <button data-grain="quarter" role="radio" data-i18n="grain_quarter">Qtr</button>
          </div>
          <button id="bell-btn" class="icon-btn bell-btn" data-i18n-title="bell_title" title="Early warnings" aria-label="Early warnings" hidden></button>
          <button id="theme-btn" class="icon-btn" data-i18n-title="toggle_theme" title="Toggle dark mode" aria-label="Toggle dark mode"></button>
        </div>
        </div>
      </header>

      <div id="net-banner" class="banner banner-net" hidden role="status"></div>
      <div id="update-banner" class="banner banner-update" hidden role="status">
        <span data-i18n="update_available">A new version of the dashboard is available.</span>
        <button id="update-btn" class="btn btn-primary btn-sm" data-i18n="reload">Reload</button></div>
      <div id="status-banner" class="banner" hidden></div>
      <section id="pre-panel" class="panel-slot" hidden></section>
      <section id="story" class="story-slot" hidden></section>
      <section id="tiles" class="tiles" aria-label="Key figures"></section>
      <section id="post-panel" class="panel-slot" hidden></section>
      <section id="report-schedules" class="rb rs" aria-label="Regular reports" hidden></section>
      <section id="report-builder" class="rb" aria-label="Report builder" hidden></section>
      <section id="settings-page" class="st" aria-label="Settings" hidden></section>
      <section id="talk-page" class="st" aria-label="Talk to Data" hidden></section>
      <section id="credits-page" class="st" aria-label="AI credits" hidden></section>
      <section id="charts" class="charts" aria-label="Charts"></section>
      <section id="hidden-panel" class="hidden-panel" hidden></section>
      <footer class="page-foot muted" id="page-foot"></footer>
    </div>
  </div>

  <!-- Drill-down: rows behind a clicked chart element (side panel; full screen on phones) -->
  <div id="drill-scrim" class="drill-scrim" hidden></div>
    <div id="user-pop" class="user-pop" role="menu" hidden>
    <div class="up-head"><b id="up-name"></b><span id="up-role" class="muted"></span><span id="up-biz" class="muted"></span></div>
    <label class="up-lang"><span data-i18n="language">Language</span><select id="pop-lang" aria-label="Language"></select></label>
    <button type="button" class="up-item" role="menuitem" id="up-credits"><span id="up-credits-ico" class="nav-ico" aria-hidden="true"></span><span data-i18n="nav_ai">AI credits</span><span id="up-credits-bar" class="up-bar"></span></button>
    <button type="button" class="up-item" role="menuitem" id="up-settings"><span id="up-settings-ico" class="nav-ico" aria-hidden="true"></span><span data-i18n="nav_settings">Settings</span></button>
    <button type="button" class="up-item" role="menuitem" id="up-logout"><span id="up-logout-ico" class="nav-ico" aria-hidden="true"></span><span data-i18n="sign_out">Sign out</span></button>
  </div>
  <aside id="drill-panel" class="drill-panel" role="dialog" aria-modal="true" aria-labelledby="drill-title" hidden>
    <div class="drill-head">
      <div class="drill-titles">
        <div class="drill-kicker" id="drill-kicker" data-i18n="drill_title">Detail rows</div>
        <h2 id="drill-title"></h2>
        <div id="drill-sub" class="muted"></div>
      </div>
      <button id="drill-close" class="icon-btn" data-i18n-title="close" title="Close" aria-label="Close"></button>
    </div>
    <div id="drill-summary" class="drill-summary"></div>
    <div id="drill-note" class="drill-note muted" hidden></div>
    <div id="drill-link" class="drill-link" hidden></div>
    <div id="drill-body" class="drill-body"></div>
    <div class="drill-foot">
      <span id="drill-trunc" class="muted"></span>
      <div class="modal-actions">
        <button id="drill-csv" class="btn" data-i18n="drill_all_csv">CSV</button>
        <button id="drill-xlsx" class="btn btn-primary" data-i18n="drill_all_xlsx">Download all rows (Excel)</button>
      </div>
    </div>
  </aside>

  <!-- Full-list download dialog -->
  <div id="export-dialog" class="modal-backdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="dlg-title">
      <h2 id="dlg-title"></h2>
      <p id="dlg-desc" class="muted"></p>
      <div id="dlg-filters" class="dlg-filters"></div>
      <div class="dlg-field"><span data-i18n="format">Format</span>
        <div class="radio-row">
          <label><input type="radio" name="dlg-format" value="xlsx" checked> Excel (.xlsx)</label>
          <label><input type="radio" name="dlg-format" value="csv"> CSV</label>
        </div>
      </div>
      <div class="modal-foot">
        <span id="dlg-count" class="muted"></span>
        <div class="modal-actions">
          <button id="dlg-cancel" class="btn" data-i18n="cancel">Cancel</button>
          <button id="dlg-download" class="btn btn-primary" data-i18n="download_btn">Download</button>
        </div>
      </div>
    </div>
  </div>
  <div id="wait-toast" class="wait-toast" hidden role="status" aria-live="polite"></div>
</body>
</html>
